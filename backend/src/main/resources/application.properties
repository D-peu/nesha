spring.application.name=nesha-backend
server.port=8080
server.address=0.0.0.0

# Perfil padrão: dev (H2 em memória). Para produção use SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT
nesha.jwt.secret=${NESHA_JWT_SECRET:troque-este-segredo-em-producao-0123456789}
nesha.jwt.expiracao-segundos=${NESHA_JWT_EXPIRACAO_SEGUNDOS:3600}
